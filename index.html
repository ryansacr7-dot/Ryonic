<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C0F; --card:#16171C; --card2:#1D1F26; --line:#262830;
  --text:#F2F2EF; --muted:#A6A8AE; --cyan:#22D3EE;
  --gold:#FACC15; --pink:#FF5FA2; --lime:#A3E635; --violet:#A78BFA; --orange:#FB923C;
  --display:'Unbounded', 'Arial Black', sans-serif;
  --body:'Space Grotesk', system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);}
body{min-height:100vh;min-height:100dvh}
button{font-family:inherit;color:inherit}
a{color:var(--cyan)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em}
.rp{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px}
.rp b{color:var(--gold)}
.avatar-btn{width:44px;height:44px;border-radius:50%;border:0;background:none;padding:0;cursor:pointer}
main{flex:1;padding:8px 20px calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:26px;margin:4px 0 0}
.sub{color:var(--muted);font-size:14px;line-height:1.45;margin:0}
.card{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.hl{outline:1.5px solid var(--cyan)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.big{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.btn{height:48px;border-radius:14px;border:0;background:var(--cyan);color:#0B0C0F;font-weight:700;font-size:16px;cursor:pointer;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;flex-shrink:0}
.btn.ghost{background:transparent;color:var(--cyan);border:2px solid var(--cyan)}
.btn.gold{background:var(--gold)}
.btn.dim{background:var(--card2);color:var(--muted);cursor:default}
.btn.small{height:44px;font-size:15px;padding:0 16px}
.btn:active{transform:scale(.97)}
.count{display:flex;gap:8px}
.count div{flex:1;background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.count b{display:block;font-family:var(--display);font-size:20px}
.count span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#2A2C33;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);border-radius:4px}
.gicon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:15px;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:11px;color:var(--muted)}
.tabs-seg{display:flex;gap:8px;overflow-x:auto}
.seg{height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--card2);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.seg.on{background:var(--cyan);color:#0B0C0F}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.item{background:var(--card);border-radius:16px;border:2px solid var(--card);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:118px;justify-content:center;text-align:center}
.item.sel{border-color:var(--cyan)}
.item small{font-size:11px;font-weight:700;color:var(--muted);line-height:1.2}
.item .tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:999px;background:var(--bg)}
.date{width:54px;flex-shrink:0;border-radius:12px;background:var(--bg);padding:8px 0;text-align:center}
.date small{display:block;font-size:11px;font-weight:700}
.date b{font-family:var(--display);font-size:17px}
.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.quest:first-child{border-top:0}
.qicon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qbar{height:6px;border-radius:3px;background:#2A2C33;overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;border-radius:3px}
.peek-img{height:150px;border-radius:14px;overflow:hidden}
.peek-img img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(17,18,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);padding:8px 0;cursor:pointer;min-height:56px;position:relative}
nav button.on{color:var(--cyan)}
nav .dot{position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--gold)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input{height:50px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;padding:0 14px;outline:none}
.field input:focus{border-color:var(--cyan)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card2);border:1.5px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.onb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:calc(30px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.lvl{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.lvl .bar{flex:1}
#player{position:fixed;inset:0;z-index:50;background:#000;display:none}
#player.on{display:block}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#player .back{position:absolute;left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;height:40px;padding:0 14px 0 10px;border-radius:999px;border:1.5px solid rgba(34,211,238,.6);background:rgba(11,12,15,.75);color:var(--text);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(6px);opacity:.85}
</style>
</head>

/* ---------- read the real game saves ---------- */
function readJSON(key) { try { const v = JSON.parse(localStorage.getItem(key) || "null"); return v && typeof v === "object" ? v : null; } catch (e) { return null; } }
function signalSave() {
  let p = 0; try { p = parseInt(localStorage.getItem("signalrun_profile") || "0", 10) || 0; } catch (e) {}
  const d = readJSON(p === 0 ? "signalrun_save" : "signalrun_save_" + p);
  if (!d) return null;
  const st = d.stats || {};
  return {
    name: d.username || "", best: d.best || 0, level: d.playerLevel || 1, prestige: d.prestige || 0, campaign: d.level || 1,
    kills: d.totalKills || 0, bosses: d.totalBossKills || 0, survive: d.longestSurvivalSeconds || 0,
    runs: st.runs || 0, wave: st.bestWave || 0, time: st.timePlayed || 0,
    achievements: Object.keys(d.achievements || {}).length, played: !!d.hasPlayedMatch || (st.runs || 0) > 0
  };
}
function boxSave() {
  let n = 1; try { n = parseInt(localStorage.getItem("boxsmash.slot") || "1", 10) || 1; } catch (e) {}
  const d = readJSON(n === 1 ? "boxsmash.save.v2" : "boxsmash.save.v2.s" + n);
  if (!d) return null;
  const st = d.stats || {};
  return { name: (d.profile && d.profile.name) || "", cleared: d.level || 0, coins: d.coins || 0,
           won: st.won || 0, firstTry: st.firstTry || 0, bestStreak: st.best || 0, played: (d.level || 0) > 0 || (st.won || 0) > 0 };
}
/* progress sent from the TestFlight / App Store game apps with "Sync to Ryonic" */
const SYNC_KEY = "ryonic:sync";
const syncData = () => readJSON(SYNC_KEY) || {};
function merged(id, local) {
  const sy = syncData()[id];
  if (!sy) return local;
  if (!local) return Object.assign({}, sy, { syncedAt: sy.t });
  const out = Object.assign({}, local);
  for (const k in sy) if (typeof sy[k] === "number" && k !== "t" && k !== "v") out[k] = Math.max(out[k] || 0, sy[k]);
  out.played = !!(local.played || sy.played); out.name = local.name || sy.name || ""; out.syncedAt = sy.t;
  return out;
}
let G = { signal: merged("signal", signalSave()), box: merged("box", boxSave()) };
const refreshGames = () => { G = { signal: merged("signal", signalSave()), box: merged("box", boxSave()) }; };

/* ---------- Ryonic state ---------- */
const KEY = "ryonic:v1";
const fresh = () => ({ nick: "", rp: 0, xp: 0, streak: 0, bestStreak: 0, lastClaim: "", owned: ["f-cyan", "n-white"],
  frame: "f-cyan", nameColor: "n-white", badge: "b-rookie", prereg: {}, preregPaid: {}, seen: [], claimed: [], badgesSeen: ["b-rookie"] });
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { S = fresh(); }
["claimed", "seen", "owned", "badgesSeen"].forEach(k => { if (!Array.isArray(S[k])) S[k] = fresh()[k]; });
["prereg", "preregPaid"].forEach(k => { if (!S[k] || typeof S[k] !== "object") S[k] = {}; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let tab = "home", lockerTab = "frames", lockerSel = null, openPeek = null, questGame = "signal", sheet = false;

/* ---------- helpers ---------- */
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => ymd(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); };
const level = (xp) => { const per = 250; return { lvl: Math.floor(xp / per) + 1, into: xp % per, per }; };
const fmtNum = (n) => Number(n || 0).toLocaleString("en-US");
const fmtTime = (s) => { s = Math.floor(s || 0); const m = Math.floor(s / 60), r = s % 60; return m + ":" + String(r).padStart(2, "0"); };
const frameColor = () => (FRAMES.find(f => f.id === S.frame) || FRAMES[0]).color;
const nameColor = () => (NAMECOLORS.find(n => n.id === S.nameColor) || NAMECOLORS[0]).color;
const badgeObj = () => BADGES.find(b => b.id === S.badge) || BADGES[0];
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const parseDate = (s) => s ? new Date(s.length <= 10 ? s + "T00:00" : s) : null;
const readyCount = () => QUESTS.filter(questReady).length;

function avatar(size) {
  const b = badgeObj();
  const letter = esc((S.nick || "?").charAt(0).toUpperCase());
  return `<span style="position:relative;display:inline-flex;width:${size}px;height:${size}px;flex-shrink:0">
    <span style="width:100%;height:100%;border-radius:50%;border:${Math.max(2, size / 16)}px solid ${frameColor()};background:#000;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:${size * 0.4}px;color:${nameColor()}">${letter}</span>
    <span style="position:absolute;right:-2px;bottom:-2px;width:${size * 0.42}px;height:${size * 0.42}px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)">${svgFill(b.icon, b.color, size * 0.26)}</span>
  </span>`;
}

let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
function give(rp, why) {
  const before = level(S.xp).lvl;
  S.rp += rp; S.xp += rp; save();
  const after = level(S.xp).lvl;
  toast(after > before ? `+${rp} RP · Level up! You're level ${after}` : `+${rp} RP · ${why}`);
  setTimeout(checkBadges, 1200);
}
function checkBadges() {
  const got = BADGES.filter(b => !S.badgesSeen.includes(b.id) && b.test());
  if (got.length) { S.badgesSeen.push(...got.map(b => b.id)); save(); toast(`New badge: ${got.map(b => b.name).join(", ")}`); render(); }
}
const unseenBadges = () => BADGES.some(b => !S.badgesSeen.includes(b.id) && b.test());

/* ---------- screens ---------- */
function onboarding() {
  return `<div class="onb">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
      ${LOGO(96)}
      <div style="font-family:var(--display);font-weight:800;font-size:30px">RYONIC</div>
      <p class="sub">Play Ryonic games, finish quests, earn cosmetics and pre-register for free.</p>
    </div>
    <div class="field">
      <label for="nick">Pick a nickname</label>
      <input id="nick" maxlength="16" autocomplete="off" placeholder="e.g. NovaPilot" value="${esc(S.nick)}">
    </div>
    <p class="note">Use a made-up nickname, not your real name. Everything stays on this device. No chat, no account.</p>
    <button class="btn" data-a="start">Let's go</button>
  </div>`;
}

function questRows(game) {
  return QUESTS.filter(q => q.game === game).map(q => {
    const done = S.claimed.includes(q.id), prog = Math.min(q.goal, questProgress(q)), ready = questReady(q);
    const g = CONFIG.games[game];
    const shown = q.fmt ? `${q.fmt(prog)} / ${q.fmt(q.goal)}` : `${fmtNum(prog)} / ${fmtNum(q.goal)}`;
    return `<div class="quest">
      ${done ? `<div class="qicon" style="background:var(--card2)">${svgFill("star", "var(--cyan)", 20)}</div>` : gameIcon(game, 40)}
      <div class="grow">
        <div style="font-size:15px;font-weight:700;${done ? "color:var(--muted)" : ""}">${esc(q.title)}</div>
        <div style="font-size:12px;color:var(--muted)">${done ? "Done" : shown} · +${q.rp} RP</div>
        ${done ? "" : `<div class="qbar"><i style="width:${(prog / q.goal) * 100}%;background:${ready ? "var(--gold)" : "var(--cyan)"}"></i></div>`}
      </div>
      ${ready ? `<button class="btn small gold" data-a="claimQuest" data-id="${q.id}">Claim</button>` : ""}
    </div>`;
  }).join("");
}

function home() {
  const now = new Date();
  const next = CONFIG.upcoming.filter(u => u.date && parseDate(u.date) > now).sort((a, b) => parseDate(a.date) - parseDate(b.date))[0] || CONFIG.upcoming[0];
  const claimed = S.lastClaim === today();
  const streakIfClaim = S.lastClaim === yesterday() ? S.streak + 1 : 1;
  const reward = 50 + 10 * Math.min(streakIfClaim - 1, 6);
  const lv = level(S.xp);
  const reg = next && S.prereg[next.id];
  const ready = readyCount();
  return `
  <div class="row">
    ${avatar(56)}
    <div class="grow">
      <div style="font-size:14px;color:var(--muted)">Hey</div>
      <div style="font-family:var(--display);font-weight:800;font-size:20px;color:${nameColor()};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(S.nick)}</div>
    </div>
  </div>
  <div class="lvl"><span>Lv ${lv.lvl}</span><div class="bar"><i style="width:${(lv.into / lv.per) * 100}%"></i></div><span>${lv.into}/${lv.per} XP</span></div>

  ${ready ? `<button class="card hl" data-a="tab" data-id="games" style="border:0;text-align:left;cursor:pointer;outline-color:var(--gold)">
    <div class="eyebrow" style="color:var(--gold)">Quests ready</div>
    <div style="font-size:17px;font-weight:700">${ready} quest${ready > 1 ? "s" : ""} done in your games. Tap to claim your RP</div>
  </button>` : ""}

  <div class="card">
    <div class="row">
      <div class="grow">
        <div style="font-size:17px;font-weight:700">Daily reward</div>
        <div class="muted" style="font-size:13px">${claimed ? `Come back tomorrow · ${S.streak}-day streak` : `Day ${streakIfClaim} streak · +${reward} RP`}</div>
      </div>
      <button class="btn small ${claimed ? "dim" : "gold"}" data-a="claim" ${claimed ? "disabled" : ""}>${claimed ? "Claimed" : "Claim"}</button>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow muted">Jump back in</div>
    ${Object.entries(CONFIG.games).map(([id, g]) => {
      const s = G[id];
      const line = !s ? "Not played yet" : id === "signal" ? `Best ${fmtNum(s.best)} · Wave ${s.wave}` : `Level ${s.cleared + 1} · ${fmtNum(s.coins)} coins`;
      return `<div class="row">
        ${gameIcon(id, 48)}
        <div class="grow"><div style="font-weight:700">${esc(g.name)}</div><div class="muted" style="font-size:13px">${line}</div></div>
        <button class="btn small" data-a="play" data-id="${id}">Play</button>
      </div>`;
    }).join("")}
  </div>

  ${next ? `<div class="card hl">
    <div class="eyebrow" style="color:var(--cyan)">Next drop</div>
    <div class="big">${esc(next.title)}</div>
    ${next.date ? `<div class="count" id="countdown"></div>` : `<div class="muted" style="font-size:15px">Release date: TBA. Pre-register to hear first.</div>`}
    <button class="btn ${reg ? "ghost" : ""}" data-a="prereg" data-id="${next.id}">${reg ? "Pre-registered" : "Pre-register free · +100 RP"}</button>
  </div>` : ""}

  <div class="eyebrow muted" style="margin-top:4px">Sneak peeks &amp; news</div>
  ${CONFIG.peeks.map(p => {
    const isNew = !S.seen.includes(p.id), open = openPeek === p.id;
    return `<div class="card">
      ${p.image ? `<div class="peek-img"><img src="${esc(p.image)}" alt=""></div>` : ""}
      <div class="row">
        <div class="grow">
          <div class="eyebrow" style="color:${({ "NEWS": "var(--cyan)", "UPDATE": "var(--lime)", "EVENT": "var(--pink)" })[p.tag] || "var(--gold)"}">${esc(p.tag)}${isNew ? " · NEW · +20 RP" : ""}</div>
          <div style="font-size:17px;font-weight:700;margin-top:4px">${esc(p.title)}</div>
        </div>
        <button class="btn small ghost" data-a="peek" data-id="${p.id}">${open ? "Close" : "Read"}</button>
      </div>
      ${open ? `<p class="sub" style="color:#D8D9DC;font-size:15px">${esc(p.body)}</p>` : ""}
    </div>`;
  }).join("")}

  ${CONFIG.channelUrl ? `<a class="btn ghost" href="${esc(CONFIG.channelUrl)}" target="_blank" rel="noopener">Follow Ryonic on WhatsApp</a>` : ""}`;
}

function games() {
  const sr = G.signal, bs = G.box;
  const card = (id, statsHtml) => {
    const g = CONFIG.games[id], s = G[id];
    return `<div class="card">
      <div class="row">
        ${gameIcon(id, 56)}
        <div class="grow"><div style="font-size:18px;font-weight:700">${esc(g.name)}</div><div class="muted" style="font-size:13px">${s && s.name ? "Playing as " + esc(s.name) : esc(g.sub)}</div></div>
        <button class="btn small" data-a="play" data-id="${id}">Play</button>
      </div>
      ${s ? statsHtml : `<div class="muted" style="font-size:13px">No progress yet. Tap Play, or sync it from the ${esc(g.name)} app.</div>`}
      <div class="muted" style="font-size:12px;line-height:1.45">${s && s.syncedAt ? `<span style="color:var(--cyan)">Synced from the ${esc(g.name)} app ${ago(s.syncedAt)}.</span> ` : ""}Playing the ${esc(g.name)} app? Tap <b style="color:var(--text)">Sync to Ryonic</b> in its ${esc(g.syncWhere)}.</div>
      ${linkRow(id)}
    </div>`;
  };
  return `<h1>Games</h1>

      <div><b>${fmtNum(sr.best)}</b><span>Best score</span></div>
      <div><b>${sr.wave}</b><span>Best wave</span></div>
      <div><b>${sr.level}${sr.prestige ? " ★" + sr.prestige : ""}</b><span>Player level</span></div>
      <div><b>${fmtNum(sr.kills)}</b><span>Kills</span></div>
      <div><b>${fmtNum(sr.bosses)}</b><span>Bosses</span></div>
      <div><b>${fmtTime(sr.survive)}</b><span>Longest run</span></div>
    </div>` : "")}
  ${card("box", bs ? `<div class="stats">
      <div><b>${bs.cleared}</b><span>Levels cleared</span></div>
      <div><b>${bs.firstTry}</b><span>First-try wins</span></div>
      <div><b>${bs.bestStreak}</b><span>Best streak</span></div>
    </div>` : "")}

  <div class="card">
    <div class="eyebrow" style="color:var(--gold)">Quests</div>
    <div class="tabs-seg">${Object.entries(CONFIG.games).map(([id, g]) => {
      const n = QUESTS.filter(q => q.game === id && questReady(q)).length;
      return `<button class="seg ${questGame === id ? "on" : ""}" data-a="qgame" data-id="${id}">${esc(g.name)}${n ? " · " + n : ""}</button>`;

    <div>${questRows(questGame)}</div>

function locker() {
  const segs = [["frames", "Frames"], ["badges", "Badges"], ["names", "Name color"]];
  let list = [];
  if (lockerTab === "frames") list = FRAMES.map(f => ({ id: f.id, name: f.name, kind: "frame", color: f.color, cost: f.cost, owned: S.owned.includes(f.id), on: S.frame === f.id }));
  if (lockerTab === "names") list = NAMECOLORS.map(n => ({ id: n.id, name: n.name, kind: "name", color: n.color, cost: n.cost, owned: S.owned.includes(n.id), on: S.nameColor === n.id }));
  if (lockerTab === "badges") list = BADGES.map(b => ({ id: b.id, name: b.name, kind: "badge", color: b.color, icon: b.icon, how: b.how, owned: b.test(), on: S.badge === b.id }));
  const sel = list.find(x => x.id === lockerSel) || list.find(x => x.on) || list[0];
  let action;
  if (sel.on) action = `<span class="btn small dim">Equipped</span>`;
  else if (sel.owned) action = `<button class="btn small" data-a="equip" data-id="${sel.id}" data-kind="${sel.kind}">Equip</button>`;
  else if (sel.kind === "badge") action = `<span class="btn small dim">Locked</span>`;
  else action = `<button class="btn small ${S.rp >= sel.cost ? "gold" : "dim"}" data-a="buy" data-id="${sel.id}" data-kind="${sel.kind}" ${S.rp >= sel.cost ? "" : "disabled"}>${sel.cost} RP</button>`;
  const preview = (x, size) => x.kind === "badge"
    ? svgFill(x.icon, x.owned ? x.color : "#3A3C44", size)
    : x.kind === "frame"
      ? `<span style="width:${size}px;height:${size}px;border-radius:50%;border:${size / 9}px solid ${x.owned ? x.color : "#3A3C44"};display:inline-block"></span>`
      : `<span style="font-family:var(--display);font-weight:800;font-size:${size * 0.55}px;color:${x.owned ? x.color : "#3A3C44"}">Aa</span>`;
  return `<h1>Locker</h1>
  <div class="card" style="flex-direction:row;align-items:center;gap:16px">
    ${avatar(76)}
    <div class="grow">
      <div class="eyebrow muted">${sel.kind === "name" ? "Name color" : sel.kind}</div>
      <div style="font-size:19px;font-weight:700;margin:2px 0 4px">${esc(sel.name)}</div>
      <div style="font-size:13px;color:${sel.owned ? "var(--cyan)" : "var(--gold)"}">${sel.kind === "badge" ? (sel.owned ? "Unlocked" : "How: " + esc(sel.how)) : (sel.owned ? "Owned" : "Buy with RP")}</div>
    </div>
  </div>
  <div class="tabs-seg">${segs.map(([id, label]) => `<button class="seg ${lockerTab === id ? "on" : ""}" data-a="seg" data-id="${id}">${label}</button>`).join("")}</div>
  <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:14px">${fmtNum(S.rp)} RP to spend</span>${action}</div>
  <div class="grid3">
    ${list.map(x => `<button class="item ${x.id === sel.id ? "sel" : ""}" data-a="pick" data-id="${x.id}" aria-label="${esc(x.name)}">
      ${preview(x, 40)}
      <small>${x.owned ? esc(x.name) : (x.kind === "badge" ? "Locked" : x.cost + " RP")}</small>
      ${x.on ? `<span class="tag" style="color:var(--cyan)">ON</span>` : ""}
    </button>`).join("")}
  </div>`;
}

function upcoming() {
  return `<h1>Upcoming</h1>
  <p class="sub">Pre-register for free and get +100 RP. Once a date is set, add it to your calendar so you get a reminder on launch day.</p>
  ${CONFIG.upcoming.map(u => {
    const d = parseDate(u.date), on = !!S.prereg[u.id];
    return `<div class="card">
      <div class="row" style="align-items:flex-start">
        <div class="date"><small style="color:${u.color}">${d ? MONTHS[d.getMonth()] : "DATE"}</small><b>${d ? d.getDate() : "TBA"}</b></div>
        <div class="grow">
          <div class="eyebrow" style="color:${u.color}">${esc(u.kind)}</div>
          <div style="font-size:17px;font-weight:700;margin-top:3px">${esc(u.title)}</div>
          <div class="muted" style="font-size:13px;margin-top:3px">${on ? "You're pre-registered" : "+100 RP for pre-registering"}</div>
        </div>
      </div>
      <button class="btn ${on ? "ghost" : ""}" data-a="prereg" data-id="${u.id}">${on ? "Pre-registered" : "Pre-register free"}</button>
      ${on && d ? `<button class="btn ghost" data-a="ics" data-id="${u.id}">Add to calendar</button>` : ""}
    </div>`;
  }).join("")}`;
}

function profileSheet() {
  return `<div class="sheet-bg" data-a="closeSheet"><div class="sheet" data-stop="1">
    <div class="row">${avatar(64)}<div class="grow"><div class="big" style="color:${nameColor()}">${esc(S.nick)}</div><div class="muted" style="font-size:14px">Level ${level(S.xp).lvl} · ${fmtNum(S.xp)} XP · best streak ${S.bestStreak}</div></div></div>
    <div class="field"><label for="nick2">Nickname</label><input id="nick2" maxlength="16" value="${esc(S.nick)}"></div>
    <button class="btn" data-a="saveNick">Save nickname</button>
    <p class="note">Your Ryonic progress is saved on this device only. Resetting here never touches your game saves.</p>
    <button class="btn ghost" data-a="reset" style="border-color:#F43F5E;color:#F43F5E">Reset Ryonic progress</button>
    <button class="btn dim" data-a="closeSheet" style="color:var(--text);cursor:pointer">Close</button>
  </div></div>`;
}

/* ---------- render ---------- */
function render() {
  const app = document.getElementById("app");
  if (!S.nick) { app.innerHTML = onboarding(); return; }
  const body = { home, games, locker, upcoming }[tab]();
  app.innerHTML = `
  <header>
    <div class="brand">${LOGO(32)} RYONIC</div>
    <div class="row" style="gap:10px">
      <div class="rp"><b>${fmtNum(S.rp)}</b> RP</div>
      <button class="avatar-btn" data-a="profile" aria-label="Profile">${avatar(44)}</button>
    </div>
  </header>
  <main>${body}</main>
  <nav>${[["home", "Home"], ["games", "Games"], ["locker", "Locker"], ["upcoming", "Upcoming"]].map(([id, label]) =>
    `<button class="${tab === id ? "on" : ""}" data-a="tab" data-id="${id}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICON[id]}</svg>${label}
      ${(id === "home" && S.lastClaim !== today()) || (id === "games" && readyCount()) || (id === "locker" && unseenBadges()) ? `<span class="dot"></span>` : ""}
    </button>`).join("")}</nav>
  ${sheet ? profileSheet() : ""}`;
  tickCountdown();
}

function tickCountdown() {
  const el = document.getElementById("countdown");
  if (!el) return;
  const now = new Date();
  const next = CONFIG.upcoming.filter(u => u.date && parseDate(u.date) > now).sort((a, b) => parseDate(a.date) - parseDate(b.date))[0];
  if (!next) { el.innerHTML = `<div><b>OUT</b><span>now</span></div>`; return; }
  let s = Math.max(0, Math.floor((parseDate(next.date) - now) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  el.innerHTML = [[d, "days"], [h, "hours"], [m, "mins"], [s, "secs"]].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
}
setInterval(tickCountdown, 1000);

/* ---------- play games inside the app ---------- */
function openGame(id) {
  const g = CONFIG.games[id];
  let sameSite = false;
  try { sameSite = new URL(g.web).host === location.host; } catch (e) {}
  // Only play inside the app when it's hosted next to the games (that's what lets it read the saves).
  // Anywhere else (a preview, a different site) open the game in a new tab so it never 404s.
  if (!sameSite) { window.open(g.web, "_blank", "noopener"); return; }
  const p = document.getElementById("player");
  const f = document.createElement("iframe");
  f.src = g.web; f.title = g.name; f.allow = "autoplay; fullscreen; gamepad";
  p.appendChild(f); p.classList.add("on"); document.body.style.overflow = "hidden";
  setTimeout(() => { try { f.focus(); } catch (e) {} }, 300);
}
function closeGame() {
  const p = document.getElementById("player");
  const f = p.querySelector("iframe");
  p.classList.remove("on"); document.body.style.overflow = "";
  if (!f) return;
  try { f.contentWindow.dispatchEvent(new Event("pagehide")); f.contentWindow.dispatchEvent(new Event("beforeunload")); } catch (e) {}
  setTimeout(() => { f.remove(); afterGame(); }, 150);
}
function afterGame() {
  const before = readyCount();
  refreshGames(); render();
  const n = readyCount();
  if (n > before) toast(`${n} quest${n > 1 ? "s" : ""} ready to claim!`);
  setTimeout(checkBadges, 1400);
}
window.addEventListener("storage", (e) => {
  if (e.key && (e.key.indexOf("signalrun") === 0 || e.key.indexOf("boxsmash") === 0)) refreshGames();
});

function downloadICS(u) {
  const d = parseDate(u.date);
  const pad = (n) => String(n).padStart(2, "0");
  const day = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const nd = new Date(d); nd.setDate(nd.getDate() + 1);
  const end = `${nd.getFullYear()}${pad(nd.getMonth() + 1)}${pad(nd.getDate())}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Ryonic//EN", "BEGIN:VEVENT", `UID:${u.id}@ryonic`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").split(".")[0]}Z`, `DTSTART;VALUE=DATE:${day}`, `DTEND;VALUE=DATE:${end}`,
    `SUMMARY:${u.title} (Ryonic)`, "BEGIN:VALARM", "TRIGGER:PT9H", "ACTION:DISPLAY", `DESCRIPTION:${u.title} is out!`, "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = u.id + ".ics"; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- actions ---------- */
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-stop]") && !e.target.closest("[data-a]")) return;
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;

  if (a === "start") {
    const v = document.getElementById("nick").value.trim();
    if (!v) { toast("Type a nickname first"); return; }
    S.nick = v.slice(0, 16); save(); render(); setTimeout(checkBadges, 400);
  }
  if (a === "tab") { tab = id; lockerSel = null; openPeek = null; refreshGames(); render(); window.scrollTo(0, 0); }
  if (a === "claim" && S.lastClaim !== today()) {
    S.streak = S.lastClaim === yesterday() ? S.streak + 1 : 1;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
    S.lastClaim = today();
    give(50 + 10 * Math.min(S.streak - 1, 6), `Day ${S.streak} streak`);
    render();
  }
  if (a === "claimQuest") {
    refreshGames();
    const q = QUESTS.find(x => x.id === id);
    if (q && questReady(q)) { S.claimed.push(q.id); give(q.rp, q.title); render(); }
  }
  if (a === "qgame") { questGame = id; render(); }
  if (a === "prereg") {
    if (S.prereg[id]) { delete S.prereg[id]; save(); toast("Pre-registration removed"); }
    else {
      S.prereg[id] = true;
      if (!S.preregPaid[id]) { S.preregPaid[id] = true; give(100, "Pre-registered!"); } else { save(); toast("Pre-registered"); }
    }
    render();
  }
  if (a === "ics") { const u = CONFIG.upcoming.find(x => x.id === id); if (u && u.date) downloadICS(u); }
  if (a === "peek") {
    openPeek = openPeek === id ? null : id;
    if (!S.seen.includes(id)) { S.seen.push(id); give(20, "Sneak peek read"); }
    render();
  }
  if (a === "play") openGame(id);
  if (a === "closeGame") closeGame();
  if (a === "seg") { lockerTab = id; lockerSel = null; render(); }
  if (a === "pick") { lockerSel = id; render(); }
  if (a === "buy") {
    const pool = el.dataset.kind === "frame" ? FRAMES : NAMECOLORS;
    const it = pool.find(x => x.id === id);
    if (it && S.rp >= it.cost && !S.owned.includes(id)) {
      S.rp -= it.cost; S.owned.push(id);
      if (el.dataset.kind === "frame") S.frame = id; else S.nameColor = id;
      save(); toast(`${it.name} unlocked and equipped`); render();
    }
  }
  if (a === "equip") {
    if (el.dataset.kind === "frame") S.frame = id;
    if (el.dataset.kind === "name") S.nameColor = id;
    if (el.dataset.kind === "badge") S.badge = id;
    save(); render();
  }
  if (a === "profile") { sheet = true; render(); }
  if (a === "closeSheet") { sheet = false; render(); }
  if (a === "saveNick") {
    const v = document.getElementById("nick2").value.trim();
    if (v) { S.nick = v.slice(0, 16); save(); toast("Nickname saved"); }
    sheet = false; render();
  }
  if (a === "reset") {
    if (confirm("Reset your Ryonic progress on this device? Your game saves stay safe.")) { S = fresh(); save(); sheet = false; tab = "home"; render(); }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "nick") document.querySelector('[data-a="start"]').click();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.nick && !document.getElementById("player").classList.contains("on")) { refreshGames(); render(); checkBadges(); }
});

/* ---------- load live content (made with Ryonic Studio) ---------- */
async function loadContent() {
  try {
    const r = await fetch("content.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const c = await r.json();
    if (typeof c.channelUrl === "string") CONFIG.channelUrl = c.channelUrl;
    if (Array.isArray(c.upcoming)) CONFIG.upcoming = c.upcoming.filter(u => u && u.id && u.title);
    if (Array.isArray(c.peeks)) CONFIG.peeks = c.peeks.filter(p => p && p.id && p.title);
    if (c.games && typeof c.games === "object") {
      for (const id in CONFIG.games) {
        const l = c.games[id]; if (!l) continue;
        if (typeof l.web === "string" && l.web.trim()) CONFIG.games[id].web = l.web.trim();
        if (typeof l.appStore === "string") CONFIG.games[id].appStore = l.appStore.trim();
      }
    }
    render();
  } catch (e) {}
}

/* ---------- receive "Sync to Ryonic" from the game apps ---------- */
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + "h ago";
  return Math.round(h / 24) + "d ago";
}
function handleSyncUrl(url) {
  if (!url || url.indexOf("sync") === -1) return;
  const d = (url.match(/[?&#]d=([^&]+)/) || [])[1], c = (url.match(/[?&]c=([^&#]+)/) || [])[1];
  if (!d || !c) return;
  const s = "ryonic|" + d; let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  if (h.toString(16) !== c) { toast("That sync link didn't look right"); return; }
  let p;
  try { p = JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g, "+").replace(/_/g, "/"))))); } catch (e) { return; }
  if (!p || !CONFIG.games[p.g] || typeof p.t !== "number") return;
  const all = syncData();
  if (all[p.g] && all[p.g].t >= p.t) return;               // already have this (or newer)
  const clean = {}; for (const k in p) if (typeof p[k] === "number" || typeof p[k] === "boolean" || (k === "name" && typeof p[k] === "string")) clean[k] = k === "name" ? p[k].slice(0, 24) : p[k];
  all[p.g] = clean;
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(all)); } catch (e) {}
  const before = readyCount();
  refreshGames();
  if (S.nick) { tab = "games"; questGame = p.g; render(); window.scrollTo(0, 0); }
  const n = readyCount() - before;
  toast(`${CONFIG.games[p.g].name} progress synced!${n > 0 ? ` ${n} quest${n > 1 ? "s" : ""} ready` : ""}`);
  setTimeout(checkBadges, 1600);
  try { if (location.hash.indexOf("sync") !== -1) history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}
(function listenForSync() {
  const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) {
    try { App.addListener("appUrlOpen", (e) => handleSyncUrl(e && e.url)); } catch (e) {}
    try { App.getLaunchUrl().then((r) => { if (r && r.url) handleSyncUrl(r.url); }).catch(() => {}); } catch (e) {}
  }
  if (location.hash.indexOf("sync") !== -1) setTimeout(() => handleSyncUrl(location.hash), 300);   // for testing in a browser
  window.addEventListener("hashchange", () => { if (location.hash.indexOf("sync") !== -1) handleSyncUrl(location.hash); });
})();

render();
loadContent();
if (S.nick) setTimeout(checkBadges, 600);
</script>
</body>
</html>
